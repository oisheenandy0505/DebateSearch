services:
  - type: web
    name: debate-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OS_HOST
        value: debate-opensearch
      - key: OS_PORT
        value: "9200"
      - key: OS_USER
        value: admin
      - key: OS_PASS
        value: admin
      - key: OS_INDEX
        value: debate_docs
      - key: FILTER_NSFW_DEFAULT
        value: "true"
      - key: STANCE_MODEL_DIR
        value: models/stance_distilbert
      - key: STANCE_CUES_PATH
        value: models/stance_cues.json
      - key: STANCE_NONE_LOGIT_BIAS
        value: "-0.35"
      - key: STANCE_MAX_LEN_INFER
        value: "128"
      - key: MASK_PII_AT_SERVE
        value: "true"

  - type: worker
    name: debate-indexer
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python indexer/index_to_es.py
    envVars:
      - key: OS_HOST
        value: debate-opensearch
      - key: OS_PORT
        value: "9200"
      - key: OS_USER
        value: admin
      - key: OS_PASS
        value: admin
      - key: OS_INDEX
        value: debate_docs

  - type: static
    name: debate-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://debate-backend.onrender.com
